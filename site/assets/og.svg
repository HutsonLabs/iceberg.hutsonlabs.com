  <text x="164" y="118" font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif"
        font-size="34" font-weight="600" letter-spacing="-0.5" fill="#E8E9EC">Iceberg</text>

  <!-- the line -->
  <text x="84" y="248" font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif"
        font-size="66" font-weight="600" letter-spacing="-2.2" fill="#E8E9EC">Put the thought down.</text>
  <text x="84" y="324" font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif"
        font-size="66" font-weight="400" font-style="italic" letter-spacing="-2.2" fill="#A8C4EE">It finds its own place.</text>

  <text x="84" y="404" font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif"
        font-size="24" font-weight="400" fill="#8A8D98">Notes, journal, and a typed graph you and your agent share.</text>
  <text x="84" y="440" font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif"
        font-size="24" font-weight="400" fill="#8A8D98">Native on iPhone, iPad, and Mac. MCP built in.</text>

  <!-- a fragment of the real graph, in the real relation colours -->
  <g stroke-width="3" stroke-linecap="round">
    <line x1="880" y1="470" x2="1010" y2="516" stroke="#9400C1"/>
    <line x1="1010" y1="516" x2="900" y2="580" stroke="#DF001D"/>
    <line x1="1010" y1="516" x2="1116" y2="470" stroke="#00B170"/>
  </g>
  <circle cx="880" cy="470" r="17" fill="#2FA79A"/>
  <circle cx="1010" cy="516" r="23" fill="#5B8DEF"/>
  <circle cx="900" cy="580" r="19" fill="#5B8DEF"/>
  <circle cx="1116" cy="470" r="15" fill="#F0A35E"/>

  <!-- beta status -->
  <rect x="84" y="500" width="216" height="44" rx="22" fill="#2A67DD"/>
  <text x="192" y="528" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif"
        font-size="17" font-weight="600" fill="#FFFFFF">Beta open on TestFlight</text>
  <text x="84" y="580" font-family="Avenir Next, Helvetica Neue, Helvetica, sans-serif"
