<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- OG card, source of truth for og.png. Re-export after any edit by
       rendering this file at 1200x630 in a browser and saving as og.png.
       Palette and type are the site's own; no claim here that the page
       does not also make. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14161D"/>
      <stop offset="0.55" stop-color="#0B0D13"/>
      <stop offset="1" stop-color="#050609"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.42" cy="0" r="0.9">
      <stop offset="0" stop-color="#3478F6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3478F6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect width="1200" height="630" fill="url(#bloom)"/>

  <!-- the waterline, three-fifths down: above it the tip, below it the graph -->
  <rect x="0" y="368" width="1200" height="1" fill="#7AA2FF" opacity="0.3"/>

  <!-- submerged mass -->
  <g opacity="0.5">
    <polygon points="806,369 1046,369 1090,510 754,530" fill="#004280" opacity="0.42"/>
    <polygon points="754,530 1090,510 1010,630 800,630" fill="#004280" opacity="0.26"/>
  </g>
  <!-- tip -->
  <polygon points="926,286 838,368 926,368" fill="#D6E8FF" opacity="0.12"/>
  <polygon points="926,286 926,368 1000,368" fill="#B4D2FF" opacity="0.07"/>
  <polygon points="926,286 918,368 934,368" fill="#F0F7FF" opacity="0.24"/>

  <!-- the mark -->
